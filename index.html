<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КИС — Тренажёр</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280;
    --accent:#4f46e5; --accent2:#6366f1; --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2; --border:#e5e7eb; --shadow:0 6px 20px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  header.top h1{font-size:20px;margin:0;line-height:1.3}
  .back{background:none;border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px}
  .back:hover{background:#eef2ff;border-color:#c7d2fe}
  .subtitle{color:var(--muted);font-size:14px;margin:4px 0 20px}

  .grid{display:grid;gap:14px}
  .qcard{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px 20px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s,border-color .12s;display:flex;align-items:center;gap:14px}
  .qcard:hover{transform:translateY(-2px);border-color:#c7d2fe}
  .qnum{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    font-weight:700;font-size:18px}
  .qcard h3{margin:0;font-size:16px;line-height:1.35}

  .levels{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  @media(max-width:640px){.levels{grid-template-columns:1fr}}
  .levelcard{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
  .levelcard:hover{transform:translateY(-2px);border-color:#c7d2fe}
  .levelcard .tag{font-size:12px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--accent)}
  .levelcard h3{margin:8px 0 6px}
  .levelcard p{margin:0;color:var(--muted);font-size:14px}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
  .prompt{font-size:15px;color:var(--muted);margin:0 0 10px}
  .task{font-size:17px;line-height:1.6;margin:0 0 16px}
  .task b{color:var(--accent)}
  .badge{display:inline-block;font-size:12px;background:#eef2ff;color:var(--accent);
    border-radius:999px;padding:4px 10px;font-weight:700;margin-bottom:14px}
  .progress{font-size:13px;color:var(--muted);margin-bottom:6px}

  .answer-area{min-height:56px;border:2px dashed var(--border);border-radius:12px;
    padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;
    background:#fafafa;margin-bottom:16px}
  .answer-area.ok{border-color:var(--green);background:var(--green-bg)}
  .answer-area.bad{border-color:var(--red);background:var(--red-bg)}
  .word{background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;cursor:pointer;user-select:none;font-size:15px;
    transition:background .1s,border-color .1s,opacity .1s}
  .word:hover{border-color:#c7d2fe;background:#eef2ff}
  .word.placed{background:#eef2ff;border-color:#c7d2fe}
  .word.locked{opacity:.35;cursor:default}
  .word.placed.correct{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .word.placed.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;cursor:pointer;font-weight:600}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .btn-primary:hover{opacity:.92}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{background:#f3f4f6}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .result{margin-top:16px;font-weight:600;display:none}
  .result.show{display:block}
  .result.ok{color:var(--green)}
  .result.bad{color:var(--red)}

  .choice{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .choice button{text-align:left;background:#fff;border:2px solid var(--border);
    border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer;line-height:1.5;
    transition:border-color .1s,background .1s}
  .choice button:hover{border-color:#c7d2fe;background:#f5f7ff}
  .choice button.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
  .choice button.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  .choice button:disabled{cursor:default}

  .blank{display:inline-block;border-bottom:2px dashed var(--accent);min-width:80px;
    color:var(--accent);font-weight:700;padding:0 4px}
  .blank.filled{border-bottom-style:solid;color:var(--green)}

  .input-label{font-size:17px;line-height:1.6;margin-bottom:12px}
  .fixed-part{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;
    padding:12px 14px;font-size:16px;line-height:1.6;margin-bottom:10px}
  .fixed-part b{color:var(--accent)}
  textarea{width:100%;min-height:120px;resize:vertical;border:2px solid var(--border);
    border-radius:12px;padding:14px;font-size:16px;font-family:inherit;line-height:1.6;background:#fafafa}
  textarea:focus{outline:none;border-color:#c7d2fe;background:#fff}
  textarea.ok{border-color:var(--green);background:var(--green-bg)}
  textarea.bad{border-color:var(--red);background:var(--red-bg)}
  .hint{color:var(--muted);font-size:13px;margin-top:10px}
  .diff{margin-top:14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;
    padding:14px;font-size:14px;line-height:1.6;display:none}
  .diff.show{display:block}
  .diff .expected{color:var(--muted)}
  .diff mark{background:#fef08a;color:#854d0e;padding:0 2px;border-radius:3px}
  .diff .missing{color:var(--red)}

  .frag-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .frag-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
    background:#fff;cursor:pointer;font-weight:600;font-size:13px}
  .frag-nav button.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .frag-nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .frag-nav button.done.active{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="back" id="backBtn" style="display:none" onclick="goBack()">← Назад</button>
    <h1 id="pageTitle">КИС — тренажёр</h1>
  </header>
  <main id="app"></main>
</div>

<script>
/* ============================================================
   ДАННЫЕ
   Каждый вопрос = набор фрагментов (fragments), которые надо выучить.
   Тип фрагмента:
   - "define":  имеет lead (начало, например "КИС — это") и tail (то, что надо набрать/собрать)
   - "item":    пункт перечня (без lead/tail), для multiple-choice и ввода
   - "list":    список пунктов (для сортировки/сборки перечня)
   ============================================================ */
const QUESTIONS = [
  /* ================= ВОПРОС 1 ================= */
  {
    id:"q1",
    title:"1. Корпоративная информационная система. Требования, предъявляемые к КИС.",
    fragments:[
      { kind:"define", lead:"КИС — это", tail:"открытая интегрированная автоматизированная система реального времени, предназначенная для автоматизации бизнес-процессов компании всех уровней, включая процессы принятия управленческих решений" },
      { kind:"define", lead:"КИС представляет собой", tail:"совокупность технических и программных средств предприятия, обеспечивающих автоматизацию его деятельности" },
      { kind:"define", lead:"Главная задача КИС —", tail:"эффективное управление всеми ресурсами предприятия для получения максимальной прибыли и удовлетворения потребностей сотрудников" },
      { kind:"list", lead:"Требования, предъявляемые к КИС:", items:[
        "Функциональная полнота системы",
        "Надежная система защиты информации",
        "Наличие средств адаптации и сопровождения системы",
        "Реализация удаленного доступа и работы в распределенных системах",
        "Обмен данными с другими ИС и программными продуктами",
        "Консолидация информации",
        "Наличие средств анализа состояния системы в процессе эксплуатации",
        "Использование архитектуры клиент-сервер с возможностью применения большинства промышленных субд",
        "Поддержка распределенной обработки информации",
        "Модульный принцип построения систем"
      ]}
    ]
  },

  /* ================= ВОПРОС 2 ================= */
  {
    id:"q2",
    title:"2. Концепция построения корпоративных информационных систем в экономике.",
    fragments:[
      { kind:"define", lead:"Концепция построения КИС — это", tail:"идея о том, из каких основных частей должна состоять система, чтобы автоматизировать работу предприятия" },
      { kind:"list", lead:"Основные компоненты:", items:[
        "Ядро системы — главная часть КИС, которая автоматизирует основные задачи управления.",
        "Система автоматизации документооборота — помогает создавать, хранить и передавать документы внутри компании.",
        "Вспомогательные системы обработки информации — помогают анализировать данные и принимать решения",
        "Средства безопасности — защищают систему и информацию от посторонних.",
        "Сервисные коммуникационные приложения — обеспечивают связь между сотрудниками.",
        "Компоненты Internet/Intranet — обеспечивают доступ к базам данных, информационным ресурсам и сервисам через интернет и внутреннюю сеть компании.",
        "Офисные программы — помогают работать с документами, таблицами и базами данных.",
        "Системы специального назначения — выполняют специальные задачи конкретной отрасли."
      ]},
      { kind:"list", lead:"Принципы построения КИС:", items:[
        "Принцип интеграции — данные вводятся один раз, а затем используются для решения разных задач. То есть не нужно вводить одну и ту же информацию заново в каждую программу.",
        "Принцип системности — все части системы должны быть связаны между собой, а информация должна помогать принимать решения на разных уровнях управления. Система также должна иметь возможность развиваться.",
        "Принцип комплексности — автоматизация должна охватывать все стадии преобразования данных при продвижении продукции компании."
      ]}
    ]
  },

  /* ================= ВОПРОС 3 ================= */
  {
    id:"q3",
    title:"3. Классификация КИС. Основные характеристики КИС.",
    fragments:[
      { kind:"list", lead:"Классификация КИС. По функциональному признаку:", items:[
        "Финансово-управленческие — помогают управлять финансами и деятельностью предприятия: учитывать доходы и расходы, планировать бюджет.",
        "Производственные — помогают управлять производством продукции и связанными с ним процессами."
      ]},
      { kind:"list", lead:"По способу распространения:", items:[
        "Заказные — создаются специально для конкретной компании с учётом её потребностей.",
        "Тиражируемые — готовые системы, которые можно внедрять в разных компаниях."
      ]},
      { kind:"list", lead:"По сложности структуры:", items:[
        "Простые – реализуют небольшое число бизнес процессов организации",
        "Среднего-класса – позволяют вести учет деятельности предприятия по многим или нескольким направлениям: финансы, логика, персонал, сбыт",
        "Высшего-класса – отличаются высоким уровнем детализации хозяйственной деятельности предприятия"
      ]},
      { kind:"list", lead:"Основные характеристики КИС:", items:[
        "Полный цикл управления — система поддерживает нормирование, планирование, учёт, анализ и регулирование деятельности предприятия.",
        "Территориальная распределённость и большие масштабы — система может объединять множество подразделений, офисов и филиалов, расположенных в разных местах.",
        "Неоднородность технического и программного обеспечения — разные подразделения могут использовать разные компьютеры, программы и оборудование.",
        "Единое информационное пространство — информация о финансах, персонале, закупках, продажах и производстве объединяется, чтобы руководители могли принимать решения на основе общих данных.",
        "Работа в неоднородной вычислительной среде — система может работать на разных технических платформах и с разными вычислительными средствами.",
        "Работа в реальном масштабе времени — система обрабатывает информацию достаточно оперативно, чтобы её можно было использовать для текущего управления."
      ]}
    ]
  },

  /* ================= ВОПРОС 4 ================= */
  {
    id:"q4",
    title:"4. Задачи, решаемые КИС. Основные стандарты построения КИС.",
    fragments:[
      { kind:"list", lead:"Задачи, решаемые КИС:", items:[
        "Формирование отчётных показателей — подготовка отчётов на основе бухгалтерских и статистических данных.",
        "Выработка стратегических управленческих решений — принятие долгосрочных решений на основе обобщённых данных.",
        "Выработка тактических решений — принятие оперативных решений на основе подробной информации."
      ]},
      { kind:"list", lead:"Основные стандарты построения КИС:", items:[
        "MRP (Material Requirements Planning) — планирование потребностей в материалах. Система рассчитывает, какие материалы и комплектующие нужны для производства и в каком количестве.",
        "MRP II (Manufacturing Resource Planning) — планирование производственных ресурсов. Помимо материалов, учитывает другие ресурсы производства: оборудование, трудовые ресурсы и производственные графики.",
        "ERP (Enterprise Resource Planning) — планирование ресурсов предприятия. Объединяет управление различными ресурсами и направлениями работы компании: производством, финансами, закупками, продажами и учётом.",
        "CSRP (Customer Synchronized Resource Planning) — планирование ресурсов с ориентацией на клиента. Учитывает потребности клиента и процессы на разных этапах жизненного цикла изделия, включая маркетинг, работу с клиентами и послепродажное обслуживание."
      ]}
    ]
  },

  /* ================= ВОПРОС 5 ================= */
  {
    id:"q5",
    title:"5. Уровни управления деятельностью корпорации",
    fragments:[
      { kind:"list", lead:"Уровни управления деятельностью корпорации:", items:[
        "Стратегический уровень. Системы поддержки принятия решений — уровень руководства предприятия, принимающего стратегические долгосрочные решения, которые определяют основные направления деятельности предприятия на длительные периоды.",
        "Тактический уровень. Информационные системы управления — процедуры среднесрочного планирования, анализа и организации работ.",
        "Уровень знаний. КИС хранит и обрабатывает структурированные (то есть систематизированные в соответствии с требованиями среднего управляющего персонала) корпоративные данные и знания.",
        "Операционный уровень. Предназначен для решения задач управления бизнес-процессами предприятия на оперативном уровне. Регистрация данных и обработка элементарных событий, сопутствующих протеканию бизнес-процессов."
      ]}
    ]
  }
];

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let state = { screen:"home", qIndex:null, level:null, fragIndex:0 };
let l1 = null;   // текущее упражнение уровня 1
let doneL1 = {}; // { qIndex: { fragIndex: true } }

const app = document.getElementById("app");
const backBtn = document.getElementById("backBtn");
const pageTitle = document.getElementById("pageTitle");

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
function goHome(){
  state = { screen:"home", qIndex:null, level:null, fragIndex:0 };
  backBtn.style.display = "none";
  pageTitle.textContent = "КИС — тренажёр";
  renderHome();
}
function goQuestion(idx){
  state = { screen:"question", qIndex:idx, level:null, fragIndex:0 };
  backBtn.style.display = "inline-block";
  pageTitle.textContent = QUESTIONS[idx].title;
  renderQuestion();
}
function goLevel(level){
  state.level = level;
  state.fragIndex = 0;
  backBtn.style.display = "inline-block";
  pageTitle.textContent = "Вопрос " + (state.qIndex+1) + " — Уровень " + level;
  if(level === 1) renderLevel1();
  else renderLevel2();
}
function goBack(){
  if(state.screen === "level"){ state.screen = "question"; goQuestion(state.qIndex); }
  else { goHome(); }
}

/* ============================================================
   ГЛАВНАЯ
   ============================================================ */
function renderHome(){
  app.innerHTML = `
    <p class="subtitle">Выберите вопрос. <b>Уровень 1</b> — заучивание наизусть (сборка из слов, выбор варианта, сортировка, пропуски). <b>Уровень 2</b> — отработка: начало фразы дано, вы вводите продолжение в точь-в-точь.</p>
    <div class="grid">
      ${QUESTIONS.map((q,i)=>`
        <div class="qcard" onclick="goQuestion(${i})">
          <div class="qnum">${i+1}</div>
          <h3>${escapeHtml(q.title)}</h3>
        </div>
      `).join("")}
    </div>
  `;
}

/* ============================================================
   СТРАНИЦА ВОПРОСА — ВЫБОР УРОВНЯ
   ============================================================ */
function renderQuestion(){
  const q = QUESTIONS[state.qIndex];
  app.innerHTML = `
    <div class="panel">
      <span class="badge">Вопрос ${state.qIndex+1}</span>
      <h2 style="margin:0 0 6px;font-size:20px">${escapeHtml(q.title)}</h2>
      <p class="prompt">Выберите уровень:</p>
      <div class="levels">
        <div class="levelcard" onclick="goLevel(1)">
          <div class="tag">Уровень 1</div>
          <h3>Заучивание наизусть</h3>
          <p>Сборка из слов, выбор правильного варианта, сортировка перечня, заполнение пропусков.</p>
        </div>
        <div class="levelcard" onclick="goLevel(2)">
          <div class="tag">Уровень 2</div>
          <h3>Отработка</h3>
          <p>Начало фразы уже дано — введите продолжение в точь-в-точь.</p>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   УРОВЕНЬ 1
   ============================================================ */
function renderLevel1(){
  const q = QUESTIONS[state.qIndex];
  const fi = state.fragIndex;
  const frag = q.fragments[fi];

  // прогресс по фрагментам
  const done = doneL1[state.qIndex] || {};
  const nav = q.fragments.map((_,i)=>`
    <button class="${done[i]?'done':''} ${i===fi?'active':''}" onclick="setFrag(${i})">${i+1}</button>
  `).join("");

  app.innerHTML = `
    <div class="panel">
      <span class="badge">Уровень 1 — Заучивание</span>
      <div class="frag-nav">${nav}</div>
      <div id="exercise"></div>
    </div>
  `;

  if(frag.kind === "define"){
    renderDefineExercise(frag);
  } else if(frag.kind === "list"){
    renderListExercise(frag);
  }
}

function setFrag(i){
  state.fragIndex = i;
  renderLevel1();
}

/* ---------- Упражнение: определение (сборка из слов) ---------- */
function renderDefineExercise(frag){
  const full = frag.lead + " " + frag.tail;
  const tokens = tokenize(full);
  const shuffled = shuffle([...tokens]);

  l1 = {
    mode:"define",
    tokens,
    pool: shuffled.map((w,i)=>({ id:i, word:w, used:false })),
    placed: [],
    checked:false
  };

  document.getElementById("exercise").innerHTML = `
    <p class="prompt">Соберите фразу, нажимая на слова в правильном порядке:</p>
    <div id="answerArea" class="answer-area"></div>
    <div id="poolArea" class="pool"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="checkL1()">Проверить</button>
      <button class="btn btn-ghost" onclick="renderLevel1()">Сбросить</button>
      <button class="btn btn-ghost" onclick="nextFrag()">Следующий фрагмент →</button>
    </div>
    <div id="l1result" class="result"></div>
  `;
  paintDefine();
}

function paintDefine(){
  const answerArea = document.getElementById("answerArea");
  const poolArea = document.getElementById("poolArea");
  answerArea.innerHTML = ""; poolArea.innerHTML = "";
  l1.placed.forEach((pidx,pos)=>{
    const item = l1.pool[pidx];
    const el = document.createElement("div");
    el.className = "word placed";
    el.textContent = item.word;
    if(l1.checked){
      if(item.word === l1.tokens[pos]) el.classList.add("correct");
      else el.classList.add("wrong");
    } else {
      el.onclick = ()=> removePlaced(pos);
    }
    answerArea.appendChild(el);
  });
  l1.pool.forEach((item, idx)=>{
    if(item.used) return;
    const el = document.createElement("div");
    el.className = "word";
    el.textContent = item.word;
    if(!l1.checked) el.onclick = ()=> placeWord(idx);
    else el.classList.add("locked");
    poolArea.appendChild(el);
  });
  if(l1.checked) answerArea.classList.add(l1.isCorrect ? "ok" : "bad");
}
function placeWord(i){ if(l1.checked) return; l1.pool[i].used = true; l1.placed.push(i); paintDefine(); }
function removePlaced(pos){ if(l1.checked) return; const i = l1.placed.splice(pos,1)[0]; l1.pool[i].used = false; paintDefine(); }

/* ---------- Упражнение: список ---------- */
function renderListExercise(frag){
  // Чередуем типы упражнений по индексу фрагмента
  const kind = (state.fragIndex % 2 === 0) ? "order" : "choice";
  if(kind === "order") renderOrderExercise(frag);
  else renderChoiceExercise(frag);
}

/* Сортировка перечня: собрать пункты в правильном порядке */
function renderOrderExercise(frag){
  const items = frag.items;
  const shuffled = shuffle(items.map((t,i)=>({ text:t, correctIndex:i })));

  l1 = {
    mode:"order",
    items,
    pool: shuffled.map((o,i)=>({ id:i, ...o, used:false })),
    placed: [],
    checked:false
  };

  document.getElementById("exercise").innerHTML = `
    <p class="prompt">Соберите перечень в правильном порядке, нажимая на пункты:</p>
    <div class="task"><b>${escapeHtml(frag.lead)}</b></div>
    <div id="answerArea" class="answer-area" style="min-height:80px;flex-direction:column"></div>
    <div id="poolArea" class="pool" style="flex-direction:column"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="checkL1()">Проверить</button>
      <button class="btn btn-ghost" onclick="renderLevel1()">Сбросить</button>
      <button class="btn btn-ghost" onclick="nextFrag()">Следующий фрагмент →</button>
    </div>
    <div id="l1result" class="result"></div>
  `;
  paintOrder();
}

function paintOrder(){
  const answerArea = document.getElementById("answerArea");
  const poolArea = document.getElementById("poolArea");
  answerArea.innerHTML = ""; poolArea.innerHTML = "";

  l1.placed.forEach((pidx,pos)=>{
    const item = l1.pool[pidx];
    const el = document.createElement("div");
    el.className = "word placed";
    el.style.width = "100%";
    el.textContent = (pos+1) + ". " + item.text;
    if(l1.checked){
      if(item.correctIndex === pos) el.classList.add("correct");
      else el.classList.add("wrong");
    } else {
      el.onclick = ()=> removePlaced(pos);
    }
    answerArea.appendChild(el);
  });
  l1.pool.forEach((item, idx)=>{
    if(item.used) return;
    const el = document.createElement("div");
    el.className = "word";
    el.style.width = "100%";
    el.textContent = item.text;
    if(!l1.checked) el.onclick = ()=> placeWord(idx);
    else el.classList.add("locked");
    poolArea.appendChild(el);
  });
  if(l1.checked) answerArea.classList.add(l1.isCorrect ? "ok" : "bad");
}

/* Выбор правильного варианта: дан пункт — выбрать, к какому заголовку он относится? */
function renderChoiceExercise(frag){
  const items = frag.items;
  const correctIdx = Math.floor(Math.random()*items.length);
  const correctText = items[correctIdx];
  // варианты ответа: правильный + 3 случайных (из других пунктов, если есть)
  const others = items.filter((_,i)=> i!==correctIdx);
  const distractors = shuffle([...others]).slice(0, Math.min(3, others.length));
  const options = shuffle([correctText, ...distractors]);

  l1 = { mode:"choice", options, correctText, checked:false };

  document.getElementById("exercise").innerHTML = `
    <p class="prompt">Выберите пункт, который относится к заголовку:</p>
    <div class="task"><b>${escapeHtml(frag.lead)}</b></div>
    <div style="color:var(--muted);font-size:14px;margin-bottom:14px">
      Один из вариантов — правильный пункт из перечня. Остальные — из этого же перечня, но не подходят по смыслу к заданию (проверьте себя, вспомнив порядок).
    </div>
    <div class="choice" id="choiceBox">
      ${options.map((o,i)=>`<button onclick="pickChoice(${i})">${escapeHtml(o)}</button>`).join("")}
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="renderLevel1()">Сбросить</button>
      <button class="btn btn-ghost" onclick="nextFrag()">Следующий фрагмент →</button>
    </div>
    <div id="l1result" class="result"></div>
  `;
}

function pickChoice(i){
  if(l1.checked) return;
  l1.checked = true;
  const btns = document.querySelectorAll("#choiceBox button");
  btns.forEach((b,idx)=>{
    b.disabled = true;
    if(l1.options[idx] === l1.correctText) b.classList.add("correct");
    else if(idx === i) b.classList.add("wrong");
  });
  l1.isCorrect = l1.options[i] === l1.correctText;
  finishL1(l1.isCorrect, "Верно! Это правильный пункт.", "Неверно. Правильный пункт подсвечен зелёным.");
}

/* Проверка для define/order */
function checkL1(){
  if(l1.mode === "choice") return;
  if(l1.placed.length === 0) return;
  l1.checked = true;
  if(l1.mode === "define"){
    const attempt = l1.placed.map(i=>l1.pool[i].word);
    l1.isCorrect = attempt.length === l1.tokens.length &&
                   attempt.every((w,i)=> w === l1.tokens[i]);
    paintDefine();
  } else if(l1.mode === "order"){
    l1.isCorrect = l1.placed.every((pidx,pos)=> l1.pool[pidx].correctIndex === pos) &&
                   l1.placed.length === l1.items.length;
    paintOrder();
  }
  finishL1(l1.isCorrect, "✅ Верно!", "❌ Пока неверно. Зелёные — на своих местах, красные — нет. Нажмите «Сбросить».");
}

function finishL1(ok, okMsg, badMsg){
  const res = document.getElementById("l1result");
  res.className = "result show " + (ok?"ok":"bad");
  res.textContent = ok ? okMsg : badMsg;
  if(ok){
    if(!doneL1[state.qIndex]) doneL1[state.qIndex] = {};
    doneL1[state.qIndex][state.fragIndex] = true;
  }
}

function nextFrag(){
  const q = QUESTIONS[state.qIndex];
  if(state.fragIndex < q.fragments.length - 1){
    state.fragIndex++;
    renderLevel1();
  } else {
    renderLevel1(); // остаёмся на последнем, можно вернуться по навигации
  }
}

/* ============================================================
   УРОВЕНЬ 2 — ОТРАБОТКА (начало дано, вводим продолжение)
   ============================================================ */
function renderLevel2(){
  const q = QUESTIONS[state.qIndex];
  const fi = state.fragIndex;
  const frag = q.fragments[fi];

  // навигация по фрагментам
  const nav = q.fragments.map((_,i)=>`
    <button class="${i===fi?'active':''}" onclick="setFrag2(${i})">${i+1}</button>
  `).join("");

  let body = "";
  if(frag.kind === "define"){
    body = `
      <div class="input-label">Введите продолжение фразы (то, что после тире/начала):</div>
      <div class="fixed-part"><b>${escapeHtml(frag.lead)}</b> — <span style="color:var(--muted)">…</span></div>
      <textarea id="answerInput" placeholder="Введите продолжение здесь..."></textarea>
      <div class="hint">Сравнение строгое: все слова, знаки препинания и порядок. Регистр букв не важен.</div>
      <div class="actions">
        <button class="btn btn-primary" onclick="checkL2('${frag.id || ''}')">Проверить</button>
        <button class="btn btn-ghost" onclick="renderLevel2()">Сбросить</button>
        <button class="btn btn-ghost" onclick="nextFrag2()">Следующий фрагмент →</button>
      </div>
      <div id="l2result" class="result"></div>
      <div id="l2diff" class="diff"></div>
    `;
  } else {
    // список: показываем заголовок и просим ввести все пункты через перевод строки
    const expected = frag.items.join("\n");
    body = `
      <div class="input-label">Введите перечень — каждый пункт с новой строки, в точь-в-точь:</div>
      <div class="fixed-part"><b>${escapeHtml(frag.lead)}</b></div>
      <textarea id="answerInput" style="min-height:200px" placeholder="Каждый пункт — с новой строки..."></textarea>
      <div class="hint">Сравнение строгое: учитываются все слова, знаки препинания, порядок строк. Регистр не важен.</div>
      <div class="actions">
        <button class="btn btn-primary" onclick="checkL2('${frag.id || ''}')">Проверить</button>
        <button class="btn btn-ghost" onclick="renderLevel2()">Сбросить</button>
        <button class="btn btn-ghost" onclick="nextFrag2()">Следующий фрагмент →</button>
      </div>
      <div id="l2result" class="result"></div>
      <div id="l2diff" class="diff"></div>
    `;
    // сохраним ожидаемое для проверки
    l1 = { mode:"l2list", expected };
  }

  app.innerHTML = `
    <div class="panel">
      <span class="badge">Уровень 2 — Отработка</span>
      <div class="frag-nav">${nav}</div>
      <div class="task"><b>${escapeHtml(q.title)}</b></div>
      ${body}
    </div>
  `;
}

function setFrag2(i){ state.fragIndex = i; renderLevel2(); }
function nextFrag2(){
  const q = QUESTIONS[state.qIndex];
  if(state.fragIndex < q.fragments.length - 1){
    state.fragIndex++;
    renderLevel2();
  }
}

function normalize(s){ return s.replace(/\s+/g," ").trim().toLowerCase(); }

function checkL2(){
  const q = QUESTIONS[state.qIndex];
  const frag = q.fragments[state.fragIndex];
  const input = document.getElementById("answerInput");
  const res = document.getElementById("l2result");
  const diffBox = document.getElementById("l2diff");
  const val = input.value;

  let expected = "";
  if(frag.kind === "define") expected = frag.tail;
  else expected = frag.items.join("\n");

  const ok = normalize(val) === normalize(expected);

  input.classList.remove("ok","bad");
  res.className = "result show " + (ok?"ok":"bad");
  diffBox.className = "diff";

  if(ok){
    input.classList.add("ok");
    res.textContent = "✅ Верно! Совпадает с эталоном.";
    diffBox.style.display = "none";
  } else {
    input.classList.add("bad");
    res.textContent = "❌ Не совпадает. Ниже — эталон и подсветка отличий.";
    diffBox.style.display = "block";
    diffBox.innerHTML = `
      <div style="font-weight:700;margin-bottom:8px">Эталон:</div>
      <div class="expected">${highlightDiff(val, expected)}</div>
      <div style="margin-top:10px;font-size:13px;color:var(--muted)">
        <mark>жёлтым</mark> — лишние/неверные слова; <span class="missing">красным</span> — пропущенные.
      </div>
    `;
  }
}

/* LCS-подсветка различий */
function highlightDiff(userText, expected){
  const u = tokenize(userText.replace(/\n/g," \n "));
  const e = tokenize(expected.replace(/\n/g," \n "));
  const m=u.length,n=e.length;
  const dp = Array.from({length:m+1},()=> new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    dp[i][j] = normalize(u[i])===normalize(e[j]) ? dp[i+1][j+1]+1
      : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0,j=0,out=[];
  while(i<m && j<n){
    if(normalize(u[i])===normalize(e[j])){ out.push(escapeHtml(e[j])); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ out.push(`<mark>${escapeHtml(u[i])}</mark>`); i++; }
    else { out.push(`<span class="missing">${escapeHtml(e[j])}</span>`); j++; }
  }
  while(i<m){ out.push(`<mark>${escapeHtml(u[i])}</mark>`); i++; }
  while(j<n){ out.push(`<span class="missing">${escapeHtml(e[j])}</span>`); j++; }
  return out.join(" ").replace(/ \n /g,"<br>");
}

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function tokenize(text){ return text.split(/\s+/).filter(Boolean); }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

/* СТАРТ */
goHome();
</script>
